[package]
name = "term-markdown"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A terminal markdown viewer with syntax-highlighted code blocks and link navigation."
repository = "https://github.com/rpmoore/term-markdown"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
pulldown-cmark = "0.13"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
